version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: databridge-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
      - FRONTEND_URL=http://localhost
    volumes:
      - ./output:/app/output        # extracted files persist here
      - ./uploads:/app/uploads      # temp excel uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: databridge-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000

  nginx:
    image: nginx:alpine
    container_name: databridge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/databridge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
