# /etc/nginx/sites-available/databridge
# Nginx reverse proxy — serves React frontend + proxies /api to Node backend

server {
    listen 80;
    server_name YOUR_VM_IP_OR_DOMAIN;   # ← replace with your Azure VM public IP

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ── React Frontend (built files) ─────────────────────────────────────────
    location / {
        root /var/www/databridge/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;   # SPA routing
    }

    # ── Node.js Backend API ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;

        # SSE support for streaming extraction logs
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600;    # Allow long-running extractions
        proxy_send_timeout 3600;
    }

    # ── File download endpoint ────────────────────────────────────────────────
    location /api/download/ {
        proxy_pass http://localhost:5000;
        proxy_buffering on;
        proxy_set_header Host $host;
    }
}
